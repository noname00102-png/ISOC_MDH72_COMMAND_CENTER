<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISOC-MDH72 Government News Monitor</title><style>body{margin:0;background:#07111f;color:#e8f0f8;font-family:system-ui,'Noto Sans Thai',sans-serif}header{padding:18px;border-bottom:1px solid #1c3550;background:#091625}main{max-width:1500px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0d1b2d;border:1px solid #1c3550;border-radius:10px;padding:15px}.v{font-size:26px;font-weight:700}button,input,select{background:#0a1727;color:#e8f0f8;border:1px solid #1c3550;border-radius:8px;padding:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.layout{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}.list{display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto}.item{background:#0d1b2d;border:1px solid #1c3550;border-radius:9px;padding:12px}.meta{font-size:12px;color:#8fa8bd}a{color:#b8d7ff}@media(max-width:900px){.grid,.layout{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.layout{grid-template-columns:1fr}}</style></head><body><header><b>📰 GOVERNMENT NEWS MONITOR • ISOC-MDH72</b><div class="meta">ข่าวจากแหล่งราชการจังหวัดมุกดาหาร • ข่าวยังไม่ถือเป็นเหตุการณ์จนกว่าจะตรวจสอบ</div></header><main><div class="toolbar"><input id="url" placeholder="Supabase URL" style="min-width:280px"><input id="key" placeholder="Publishable/anon key" style="min-width:280px"><button onclick="connect()">เชื่อมต่อ</button><select id="level"><option value="">ทุกระดับ</option><option>PROVINCE</option><option>AMPHOE</option><option>TAMBON</option></select><button onclick="loadAll()">รีเฟรช</button></div><div class="grid"><div class="card">แหล่งข่าว VERIFIED<div class="v" id="sources">–</div></div><div class="card">ข่าวรวบรวม<div class="v" id="news">–</div></div><div class="card">รอตรวจสอบ<div class="v" id="pending">–</div></div><div class="card">ยืนยันแล้ว<div class="v" id="verified">–</div></div></div><div class="layout"><section class="card"><h3>Source Registry</h3><div id="sourceList" class="list"></div></section><section class="card"><h3>News Queue</h3><div id="newsList" class="list"></div></section></div></main><script>let base='',key='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function connect(){base=document.getElementById('url').value.trim().replace(/\/$/,'');key=document.getElementById('key').value.trim();localStorage.setItem('mdh_news_url',base);localStorage.setItem('mdh_news_key',key);loadAll()}async function api(path){const r=await fetch(base+'/rest/v1/'+path,{headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok)throw Error(await r.text());return r.json()}async function loadAll(){if(!base){base=localStorage.getItem('mdh_news_url')||'';key=localStorage.getItem('mdh_news_key')||''}if(!base||!key)return;try{const level=document.getElementById('level').value;const sq=level?'government_news_sources?select=*&source_level=eq.'+encodeURIComponent(level)+'&order=priority.asc,source_name.asc':'government_news_sources?select=*&order=priority.asc,source_name.asc';const s=await api(sq),n=await api('government_news_items?select=*&order=published_at.desc.nullslast,created_at.desc&limit=200');document.getElementById('sources').textContent=s.filter(x=>x.verification_status==='VERIFIED').length;document.getElementById('news').textContent=n.length;document.getElementById('pending').textContent=n.filter(x=>!['VERIFIED','REJECTED'].includes(x.verification_status)).length;document.getElementById('verified').textContent=n.filter(x=>x.verification_status==='VERIFIED').length;document.getElementById('sourceList').innerHTML=s.map(x=>'<div class="item"><b>'+esc(x.source_name)+'</b><div class="meta">'+esc(x.source_level)+' · '+esc(x.verification_status)+' · Priority '+esc(x.priority)+'</div><div class="meta">'+(x.website_url?'<a target="_blank" rel="noopener" href="'+esc(x.website_url)+'">เปิดเว็บไซต์ทางการ</a>':'ไม่มี URL')+'</div></div>').join('')||'<div class="meta">ไม่พบข้อมูล</div>';document.getElementById('newsList').innerHTML=n.map(x=>'<article class="item"><b>'+esc(x.title)+'</b><div class="meta">'+esc(x.source_name)+' · '+esc(x.verification_status)+'</div><div>'+esc(x.summary||'')+'</div><div class="meta"><a target="_blank" rel="noopener" href="'+esc(x.original_url)+'">เปิดแหล่งข่าวต้นฉบับ</a></div></article>').join('')||'<div class="meta">ยังไม่มีข่าว</div>'}catch(e){alert('เชื่อมต่อ/อ่านข้อมูลไม่สำเร็จ: '+e.message)}}addEventListener('DOMContentLoaded',loadAll)</script></body></html>
