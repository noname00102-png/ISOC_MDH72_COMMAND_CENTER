name: Patch Trend14 threshold

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Trend14 threshold
        shell: python
        run: |
          from pathlib import Path
          p = Path('ISOC6_TREND14_PERIODS_FINAL_QA(1).html')
          s = p.read_text(encoding='utf-8')

          old_level = "if(n<60)return{key:'level1',color:'#22c55e',label:'ระดับ 1'};if(n<90)return{key:'level2',color:'#f97316',label:'ระดับ 2'};"
          new_level = "if(n<70)return{key:'level1',color:'#22c55e',label:'ระดับ 1'};if(n<90)return{key:'level2',color:'#f97316',label:'ระดับ 2'};"
          old_legend = 'ระดับ 1 &lt; 60%</span><span class="mdh72-trend14-legend-item"><i class="mdh72-trend14-legend-dot level2"></i>ระดับ 2 60–89.9%'
          new_legend = 'ระดับ 1 &lt; 70%</span><span class="mdh72-trend14-legend-item"><i class="mdh72-trend14-legend-dot level2"></i>ระดับ 2 70–89.9%'

          if s.count(old_level) != 1:
              raise SystemExit(f'Unexpected level rule occurrences: {s.count(old_level)}')
          if s.count(old_legend) != 1:
              raise SystemExit(f'Unexpected legend occurrences: {s.count(old_legend)}')

          s = s.replace(old_level, new_level)
          s = s.replace(old_legend, new_legend)
          s = s.replace('mdh72-trend-version" content="V17 Traffic Light + Spatial Overlay + Temporal + Link Analysis"',
                        'mdh72-trend-version" content="V18 Traffic Light 70/90 + Spatial Overlay + Temporal + Link Analysis"')
          p.write_text(s, encoding='utf-8')

          verify = p.read_text(encoding='utf-8')
          assert "if(n<70)return{key:'level1'" in verify
          assert "ระดับ 1 &lt; 70%" in verify
          assert "ระดับ 2 70–89.9%" in verify
          assert "if(n<60)return{key:'level1'" not in verify
          assert "ระดับ 1 &lt; 60%" not in verify

      - name: Commit target only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'ISOC6_TREND14_PERIODS_FINAL_QA(1).html'
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- 'ISOC6_TREND14_PERIODS_FINAL_QA(1).html'
          git commit -m "fix: align Trend14 color thresholds to 70/90"
          git push

      - name: Remove temporary workflow
        if: ${{ success() }}
        shell: bash
        run: |
          git rm -- '.github/workflows/patch-trend14-threshold.yml'
          git commit -m "chore: remove temporary Trend14 patch workflow"
          git push
