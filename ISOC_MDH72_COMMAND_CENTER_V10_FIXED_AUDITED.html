/* ================================
   V3 COMMAND CENTER DISTRICT ENGINE
   Supabase -> District Color
================================ */

const districtStatus = {};

function getThreatColor(level){
  level = (level||"").toString().toLowerCase();

  if(level.includes("วิกฤต") || level.includes("critical"))
    return "#ef4444";

  if(level.includes("สูง") || level.includes("high"))
    return "#f97316";

  if(level.includes("เฝ้าระวัง"))
    return "#eab308";

  return "#22c55e";
}

// Legacy district-color routine intentionally disabled.
// The authoritative controller below owns all map styling to prevent
// duplicate timers/functions from overwriting threat colors.
function applyDistrictSituation(rows){
  if(typeof window.mdhApplyMapThreatColors==='function') return window.mdhApplyMapThreatColors();
  return null;
}


/* =====================================
   V4 USER ROLE PERMISSION ENGINE
===================================== */

window.currentUserRole = "viewer";

const ROLE_PERMISSION = {
  admin:{
    name:"ผู้ดูแลระบบ",
    edit:true,
    report:true,
    manageUser:true
  },
  commander:{
    name:"ผู้บังคับบัญชา",
    edit:false,
    report:true,
    manageUser:false
  },
  officer:{
    name:"เจ้าหน้าที่ปฏิบัติการ",
    edit:true,
    report:true,
    manageUser:false
  },
  viewer:{
    name:"ทั่วไป",
    edit:false,
    report:false,
    manageUser:false
  }
};

function setUserRole(role){
  window.currentUserRole = role;
  const p = ROLE_PERMISSION[role] || ROLE_PERMISSION.viewer;

  document.querySelectorAll("[data-permission]").forEach(el=>{
    const need = el.dataset.permission;

    if(p[need]){
      el.style.display="";
    }else{
      el.style.display="none";
    }
  });

  const box=document.getElementById("userRole");
  if(box) box.textContent=(p.name==="ทั่วไป"?"":p.name);
}


/* =====================================
 V5 AUTH PROFILE READY
 Supabase Auth + profiles preparation
===================================== */

let profileUser = {
  id:null,
  name:"ยังไม่ได้เข้าสู่ระบบ",
  role:"viewer"
};

async function loadUserProfile(userId){
  // เตรียมเชื่อม Supabase table: profiles
  // fields แนะนำ:
  // id, name, role, department, active

  if(!window.sb){
    console.warn("Supabase client not ready");
    return;
  }

  const {data,error}=await window.sb
    .from("profiles")
    .select("id,name,role,department,position")
    .eq("id",userId)
    .maybeSingle();

  if(error){
    console.warn("profile:",error.message);
    window.profileUser={id:userId,name:"ไม่พบโปรไฟล์",role:"viewer"};
    window.currentUserRole="viewer";
    setUserRole("viewer");
    return;
  }

  profileUser=data || {id:userId,name:"ไม่พบโปรไฟล์",role:"viewer"};
  setUserRole(data?.role || "viewer");

  const box=document.getElementById("userRole");
  if(box){
    box.textContent =
      (data.name || "เจ้าหน้าที่")+
      " : "+
      (ROLE_PERMISSION[data.role]?.name || "ทั่วไป");
  }
}

function checkPermission(permission){
  const role=ROLE_PERMISSION[window.currentUserRole];
  return !!(role && role[permission]);
}
function normalizedRoleForUI(){
  const r=String(window.currentUserRole || window.profileUser?.role || 'viewer').trim().toLowerCase();
  if(['admin','administrator','ผู้ดูแลระบบ'].includes(r)) return 'admin';
  if(['officer','เจ้าหน้าที่','เจ้าหน้าที่ปฏิบัติการ'].includes(r)) return 'officer';
  if(['commander','ผู้บังคับบัญชา'].includes(r)) return 'commander';
  return 'viewer';
}
window.normalizedRoleForUI = normalizedRoleForUI;
function roleCanEditV24(){ return ['admin','officer'].includes(window.normalizedRoleForUI()); }
function roleCanDeleteV24(){ return window.normalizedRoleForUI()==='admin'; }

/* =====================================
 V6 LOGIN AUTH PREPARATION
 Supabase Authentication Interface
===================================== */

async function loginOfficer(email,password){

  if(!window.sb){
    alert("ระบบเชื่อมต่อฐานข้อมูลยังไม่พร้อม");
    return;
  }

  const {data,error}=await window.sb.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){
    console.error('[AUTH LOGIN]',error);
    throw error;
  }

  if(data.user){
    if(typeof window.mdhSetExplicitLogin==="function"){
      window.mdhSetExplicitLogin(true);
    }
    await loadUserProfile(data.user.id);
    if(typeof window.updateThreatButton==="function"){
      await window.updateThreatButton();
    }
    if(typeof closeLoginModal==="function"){
      closeLoginModal();
    }else{
      const modal=document.querySelector(".modal-back");
      if(modal) modal.style.display="none";
    }
    if(typeof connectUserProfile==="function"){
      await connectUserProfile();
    }
    if(typeof applyActiveRoleUI==="function"){
      applyActiveRoleUI();
    }
    saveAudit("LOGIN","User login");
  }
}


async function logoutOfficer(){
  try{
    if(typeof window.mdhSetExplicitLogin==='function'){
      window.mdhSetExplicitLogin(false);
    }
    if(window.sb?.auth) await window.sb.auth.signOut();
    rows=[];
    updateKpis();renderLatest();renderEvents();
  }finally{
    try{ await window.updateThreatButton(); }catch(e){}
  }
}


async function checkLoginSession(){
  if(!window.sb) return;
  // A persisted Supabase session is not treated as a fresh page login.
  if(window.mdhHasExplicitLogin && !window.mdhHasExplicitLogin()) return;
  const {data}=await window.sb.auth.getSession();
  if(data.session) await loadUserProfile(data.session.user.id);
  else if(window.mdhSetExplicitLogin) window.mdhSetExplicitLogin(false);
}

/* =====================================
 V8 PROFILE CONNECT
 Auth User -> profiles -> Dashboard Role
===================================== */

async function connectUserProfile(){

  if(!window.sb || !window.sb.auth){
    console.warn("Supabase Auth not ready");
    return;
  }

  const {data} = await window.sb.auth.getUser();

  if(!data.user){
    console.log("No login session");
    return;
  }

  const {data:profile,error}=await window.sb
    .from("profiles")
    .select("*")
    .eq("id",data.user.id)
    .single();

  if(error){
    console.warn("Profile not found",error.message);
    return;
  }

  profileUser = profile;
  setUserRole(profile.role || "general");

  const userBox=document.getElementById("userRole");
  if(userBox){
    userBox.textContent =
      profile.name+" | "+
      (ROLE_PERMISSION[profile.role]?.name || profile.role);
  }
}

function requirePermission(permission){

  const role = ROLE_PERMISSION[currentUserRole];

  if(!role || !role[permission]){
    alert("ไม่มีสิทธิ์ใช้งานส่วนนี้");
    return false;
  }

  return true;
}


/* =====================================
 V9 ROLE ACTIVE DASHBOARD
 Profile Role -> UI Control
===================================== */

function applyActiveRoleUI(){

 const rawRole = String(window.currentUserRole || profileUser?.role || "viewer")
   .normalize("NFC").trim().toLowerCase();
 const role = ["admin","administrator","ผู้ดูแลระบบ"].includes(rawRole) ? "admin"
   : ["officer","เจ้าหน้าที่","เจ้าหน้าที่ปฏิบัติการ"].includes(rawRole) ? "officer"
   : ["commander","ผู้บังคับบัญชา"].includes(rawRole) ? "commander"
   : "viewer";
 const perm = ROLE_PERMISSION[role] || ROLE_PERMISSION.viewer;
 window.currentUserRole = role;

 document.querySelectorAll("[data-permission]").forEach(el=>{
   const need = el.dataset.permission;
   el.style.display = perm[need] ? "" : "none";
 });

 const roleBox=document.getElementById("userRole");
 if(roleBox && profileUser){
   const displayName = String(profileUser.name || "เจ้าหน้าที่").trim();
   const roleName = String(perm.name || role).trim();
   roleBox.innerHTML = displayName && displayName === roleName
     ? "👤 "+displayName
     : "👤 "+displayName+"<br>"+roleName;
 }
}


// ป้องกันการเข้าหน้าสำคัญ
function openProtected(permission,callback){

 if(requirePermission(permission)){
    callback();
 }
}
