<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISOC MDH72 COMMAND CENTER</title><style>body{font-family:Arial,sans-serif;background:#061827;color:#fff;margin:0}.box{margin:20px;padding:20px;border:1px solid #285978;border-radius:12px;background:#092235}button,input,select,textarea{padding:9px;margin:4px;border-radius:7px;border:1px solid #47718b}button{cursor:pointer}.admin{display:none}.form{display:none}.danger{background:#7d2222;color:#fff}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border:1px solid #376078}td{vertical-align:top}@media(max-width:700px){.row{grid-template-columns:1fr}table{font-size:12px}}</style></head><body><div class="box"><h2>📄 รายงานสถานการณ์จังหวัดมุกดาหาร</h2><p id="summary">กำลังเชื่อมต่อ Supabase...</p><table><thead><tr><th>เหตุการณ์</th><th>ประเภทภัย</th><th>ระดับ</th><th>อำเภอ/ตำบล</th><th>รายละเอียด</th><th>จัดการ</th></tr></thead><tbody id="report"></tbody></table></div><div class="box"><button onclick="login()">🔐 เข้าสู่ระบบเจ้าหน้าที่</button><div id="adminMenu" class="admin"><button onclick="showForm()">➕ เพิ่มเหตุการณ์</button><button onclick="loadReport()">🔄 รีเฟรช</button><button onclick="logout()">ออกจากระบบ</button><button onclick="window.print()">🖨️ พิมพ์</button></div><div id="form" class="form"><h3 id="formTitle">เพิ่มเหตุการณ์</h3><input id="title" placeholder="ชื่อเหตุการณ์"><input id="threat_type" placeholder="ประเภทภัย"><select id="threat_level"><option>ปกติ</option><option>เฝ้าระวัง</option><option>เร่งด่วน</option><option>วิกฤต</option></select><div class="row"><input id="district" placeholder="อำเภอ"><input id="subdistrict" placeholder="ตำบล"><input id="visibility" placeholder="visibility" value="public"></div><textarea id="description" placeholder="รายละเอียด" rows="4" style="width:95%"></textarea><input id="lat" type="number" step="any" placeholder="ละติจูด"><input id="lng" type="number" step="any" placeholder="ลองจิจูด"><button onclick="saveThreat()">💾 บันทึก</button><button onclick="hideForm()">ยกเลิก</button><input type="hidden" id="editId"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://riuebseoczwwifxezcwj.supabase.co',SUPABASE_KEY='sb_publishable_G6QyDB6Ux0Rd9yzbuQCCoQ_mkyu7wuO',TABLE='threats',sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let rows=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function loadReport(){const{data,error}=await sb.from(TABLE).select('*').order('created_at',{ascending:false});if(error){$('summary').textContent='โหลดข้อมูลไม่สำเร็จ: '+error.message;return}rows=data||[];$('summary').textContent='เหตุการณ์ทั้งหมด '+rows.length+' รายการ';$('report').innerHTML=rows.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.threat_type)}</td><td>${esc(x.threat_level)}</td><td>${esc(x.district)} / ${esc(x.subdistrict)}</td><td>${esc(x.description)}</td><td>${$('adminMenu').style.display==='block'?`<button onclick="editThreat('${x.id}')">✏️ แก้ไข</button><button class="danger" onclick="deleteThreat('${x.id}')">🗑️ ลบ</button>`:'-'}</td></tr>`).join('')}async function login(){const email=prompt('อีเมลเจ้าหน้าที่');const password=prompt('รหัสผ่าน');if(!email||!password)return;const{error}=await sb.auth.signInWithPassword({email,password});if(error)return alert('เข้าสู่ระบบไม่สำเร็จ: '+error.message);const{data:{user}}=await sb.auth.getUser();const{data:profile}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(profile&&!['admin','administrator','เจ้าหน้าที่'].includes(String(profile.role).toLowerCase())){await sb.auth.signOut();return alert('บัญชีนี้ไม่มีสิทธิ์จัดการข้อมูล')}$('adminMenu').style.display='block';loadReport()}async function logout(){await sb.auth.signOut();$('adminMenu').style.display='none';hideForm();loadReport()}function showForm(x={}){$('form').style.display='block';$('formTitle').textContent=x.id?'แก้ไขเหตุการณ์':'เพิ่มเหตุการณ์';$('editId').value=x.id||'';['title','threat_type','threat_level','district','subdistrict','visibility','description'].forEach(k=>$(k).value=x[k]??(k==='visibility'?'public':''));$('lat').value=x.latitude??'';$('lng').value=x.longitude??''}function hideForm(){$('form').style.display='none'}function editThreat(id){const x=rows.find(r=>r.id===id);if(x)showForm(x)}async function saveThreat(){const{data:{user}}=await sb.auth.getUser();if(!user)return alert('กรุณาเข้าสู่ระบบ');const id=$('editId').value;const payload={title:$('title').value.trim(),threat_type:$('threat_type').value.trim(),threat_level:$('threat_level').value,description:$('description').value.trim()||null,district:$('district').value.trim()||null,subdistrict:$('subdistrict').value.trim()||null,visibility:$('visibility').value||'public',latitude:$('lat').value?Number($('lat').value):null,longitude:$('lng').value?Number($('lng').value):null,updated_at:new Date().toISOString()};if(!payload.title||!payload.threat_type)return alert('กรุณากรอกชื่อเหตุการณ์และประเภทภัย');let q=id?sb.from(TABLE).update(payload).eq('id',id):sb.from(TABLE).insert({...payload,created_by:user.id,created_at:new Date().toISOString(),status:'active'});const{error}=await q;if(error)return alert('บันทึกไม่สำเร็จ: '+error.message);hideForm();loadReport()}async function deleteThreat(id){if(!confirm('ยืนยันลบเหตุการณ์นี้?'))return;const{error}=await sb.from(TABLE).delete().eq('id',id);if(error)return alert('ลบไม่สำเร็จ: '+error.message);loadReport()}sb.auth.onAuthStateChange((event,session)=>{if(!session)$('adminMenu').style.display='none'});sb.channel('threats-live').on('postgres_changes',{event:'*',schema:'public',table:TABLE},loadReport).subscribe();loadReport();</script></body></html>
