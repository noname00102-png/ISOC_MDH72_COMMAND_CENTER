<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISOC-MDH72 • Government News Monitor</title><style>:root{--bg:#07111f;--panel:#0d1b2d;--line:#1c3550;--text:#e8f0f8;--muted:#8fa8bd;--ok:#36c98f;--warn:#f0b44b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--line);background:#091625}h1{font-size:20px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}main{max-width:1500px;margin:auto;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select,button{border:1px solid var(--line);background:#0a1727;color:var(--text);border-radius:8px;padding:10px 12px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px}.k,.meta{color:var(--muted);font-size:12px}.v{font-size:26px;font-weight:700;margin-top:4px}.layout{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}.list{display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto}.item h3{font-size:15px;margin:0 0 6px}.ok{color:var(--ok)}.warn{color:var(--warn)}a{color:#b8d7ff}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>📰 GOVERNMENT NEWS MONITOR • ISOC-MDH72</h1><div class="sub">ข่าวจากแหล่งราชการจังหวัดมุกดาหาร • ข่าวภายนอกยังไม่ถือเป็นเหตุการณ์จนกว่าจะตรวจสอบ</div></header><main><div class="toolbar"><input id="url" placeholder="Supabase URL" style="min-width:300px"><input id="key" placeholder="Publishable/anon key" style="min-width:300px"><button onclick="connect()">เชื่อมต่อ</button><select id="level"><option value="">ทุกระดับ</option><option>PROVINCE</option><option>AMPHOE</option><option>TAMBON</option></select><button onclick="loadAll()">รีเฟรชข้อมูล</button></div><div class="grid"><div class="card"><div class="k">แหล่งข่าวที่ยืนยัน</div><div class="v" id="sources">–</div></div><div class="card"><div class="k">ข่าวที่รวบรวม</div><div class="v" id="news">–</div></div><div class="card"><div class="k">รอตรวจสอบ</div><div class="v" id="pending">–</div></div><div class="card"><div class="k">ยืนยันแล้ว</div><div class="v" id="verified">–</div></div></div><div class="layout"><section class="card"><h2 style="font-size:16px">แหล่งข่าว</h2><div id="sourceList" class="list"></div></section><section class="card"><h2 style="font-size:16px">ข่าวสารสถานการณ์</h2><div id="newsList" class="list"></div></section></div></main><script>let base="",key="";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function connect(){base=document.getElementById("url").value.trim().replace(/\/$/,"");key=document.getElementById("key").value.trim();if(!base||!key)return alert("กรุณาระบุ Supabase URL และ publishable/anon key");localStorage.setItem("mdh_news_url",base);localStorage.setItem("mdh_news_key",key);loadAll()}async function api(path){const r=await fetch(base+"/rest/v1/"+path,{headers:{apikey:key,Authorization:"Bearer "+key}});if(!r.ok)throw new Error(await r.text());return r.json()}async function loadAll(){if(!base){base=localStorage.getItem("mdh_news_url")||"";key=localStorage.getItem("mdh_news_key")||""}if(!base||!key)return;try{const level=document.getElementById("level").value;const q=level?`government_news_sources?select=*&source_level=eq.${encodeURIComponent(level)}&order=priority.asc,source_name.asc`:"government_news_sources?select=*&order=priority.asc,source_name.asc";const s=await api(q),n=await api("government_news_items?select=*&order=published_at.desc.nullslast,created_at.desc&limit=200");document.getElementById("sources").textContent=s.filter(x=>x.verification_status==="VERIFIED").length;document.getElementById("news").textContent=n.length;document.getElementById("pending").textContent=n.filter(x=>x.verification_status!=="VERIFIED"&&x.verification_status!=="REJECTED").length;document.getElementById("verified").textContent=n.filter(x=>x.verification_status==="VERIFIED").length;document.getElementById("sourceList").innerHTML=s.map(x=>`<div class="item"><h3>${esc(x.source_name)}</h3><div class="meta">${esc(x.source_level)} · <span class="${x.verification_status==="VERIFIED"?"ok":"warn"}">${esc(x.verification_status)}</span> · Priority ${esc(x.priority)}</div><div class="meta">${x.website_url?`<a target="_blank" rel="noopener" href="${esc(x.website_url)}">${esc(x.website_url)}</a>`:"ไม่มี URL"}</div></div>`).join("")||"<div class='meta'>ไม่พบข้อมูล</div>";document.getElementById("newsList").innerHTML=n.map(x=>`<article class="item"><h3>${esc(x.title)}</h3><div class="meta">${esc(x.source_name)} · ${esc(x.amphoe||"")} ${esc(x.tambon||"")} · ${esc(x.verification_status)}</div><div style="margin-top:7px">${esc(x.summary||"")}</div><div class="meta" style="margin-top:7px"><a target="_blank" rel="noopener" href="${esc(x.original_url)}">เปิดแหล่งข่าวต้นฉบับ</a></div></article>`).join("")||"<div class='meta'>ยังไม่มีข่าวที่รวบรวมจากแหล่งที่เชื่อมต่อ</div>"}catch(e){alert("เชื่อมต่อ/อ่านข้อมูลไม่สำเร็จ: "+e.message)}}window.addEventListener("DOMContentLoaded",loadAll);</script></body></html>
