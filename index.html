<iframe id="app" src="./ISOC_MDH72_COMMAND_CENTER_V2_REPORT_ADMIN-1.html?v=20260910-10" title="ISOC MDH72 COMMAND CENTER"></iframe>
<script>
'use strict';
const frame=document.getElementById('app');
const scripts=[
 './mdh72-supabase-connection.js?v=20260910-1',
 './mdh72-runtime-hardening.js?v=20260910-5',
 './mdh72-mekong-water.js?v=20260910-5',
 './mdh72-data-integrity.js?v=20260910-5',
 './mdh72-weather-history-sidebar.js?v=20260910-5',
 './mdh72-command-center-enhancement.js?v=20260910-5',
 './mdh72-map-menu.js?v=20260910-5',
 './mdh72-production-hardening.js?v=20260910-5',
 './mdh72-production-fixes.js?v=20260910-5',
 './mdh72-production-integration.js?v=20260910-2',
 './mdh72-threat-sidebar.js?v=20260910-2',
 './mdh72-threat-click-results.js?v=20260910-1',
 './mdh72-map-legend.js?v=20260910-2',
 './mdh72-final-ui-override.js?v=20260910-1'
];
const installed=new Set();
function loadScriptOnce(doc,src){const key=src.split('?')[0];if(installed.has(key))return;const exists=[...doc.scripts].some(s=>(s.getAttribute('src')||'').split('?')[0]===key);if(exists){installed.add(key);return}const s=doc.createElement('script');s.src=src;s.async=false;s.onload=()=>installed.add(key);s.onerror=e=>console.error('[MDH72 LAUNCHER] failed',src,e);doc.head.appendChild(s)}
function install(){try{const doc=frame.contentDocument;if(!doc||!doc.head)return;scripts.forEach(src=>loadScriptOnce(doc,src));frame.dataset.mdhScriptsInstalled='1'}catch(e){console.error('[MDH72 LAUNCHER] install failed',e)}}
frame.addEventListener('load',install);install();
</script>
</body>
