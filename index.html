<script>
(function(){
  const frame=document.getElementById('app');
  function inject(){
    try{
      const d=frame.contentDocument;
      if(!d||!d.body)return;
      if(d.getElementById('mdh-live-data-fix-script'))return;
      const s=d.createElement('script');
      s.id='mdh-live-data-fix-script';
      s.src='./MDH72_LIVE_DATA_FIX_V7.js?v=20260910-15';
      d.body.appendChild(s);
    }catch(e){console.error('[MDH LIVE PATCH INJECT]',e)}
  }
  frame.addEventListener('load',inject);
  setTimeout(inject,1500);
})();
</script>
